name: Auto Update Live FPL Data

on:
  schedule:
    # Run every 5 minutes on GitHub Cloud
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  update-fpl-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch Live FPL Data & Compile Web Assets
        run: |
          python3 scripts/build_fpl_live.py
          python3 scripts/organize_web_files.py

      - name: Commit and Push Data Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ web/ visualizer_data.json visualizer_data_2026_27.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update live FPL data [skip ci]" && git push origin main)
